<app-header
  logo="/logos/logo-olivos.svg"
  color="#908e8e61"
></app-header>

<main class="error-page">

  <div class="error-page__overlay">
    <div class="error-page__content">

      <p class="error-page__code" aria-hidden="true">{{ errorConfig.code }}</p>

      <h1 class="error-page__heading">{{ errorConfig.heading }}</h1>

      <p class="error-page__message">{{ errorConfig.message }}</p>

      <a routerLink="/" class="error-page__btn">
        Volver al inicio
      </a>

    </div>
  </div>

</main>
