<div class="contact-banner" [style.background]="background()">
  <div class="banner-content">
    <h1>¿Necesitas ayuda?</h1>
    <p>Contacta con nosotros y te ayudaremos en todo lo que necesites.</p>
    <div class="buttons">
      <a href="https://api.whatsapp.com/send/?phone=573104171085" target="_blank" rel="noopener">
        <button type="button" class="primary-button">
          Escríbenos
          <i class="fa-solid fa-arrow-right-long"></i>
        </button>
      </a>
      <button type="button" class="secondary-button" (click)="phoneClick.emit()">
        Llámanos
        <i class="fa-solid fa-arrow-right-long"></i>
      </button>
    </div>
  </div>
  <div class="banner-image">
    <img src="/img/necesitas-ayuda.png" alt="" />
  </div>
</div>
